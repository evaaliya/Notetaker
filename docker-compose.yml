# Project name = directory basename by default (so clones in different folders
# get separate volumes). Override with env COMPOSE_PROJECT_NAME or `docker compose -p`.
# Host ports are overridable so a second copy does not collide on the host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notetaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notetaker}
      POSTGRES_DB: ${POSTGRES_DB:-notetaker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-notetaker}:${POSTGRES_PASSWORD:-notetaker}@postgres:5432/${POSTGRES_DB:-notetaker}
      E2E_HOOKS: ${E2E_HOOKS:-false}
      UPLOADS_DIR: /uploads
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  worker:
    build: ./api
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-notetaker}:${POSTGRES_PASSWORD:-notetaker}@postgres:5432/${POSTGRES_DB:-notetaker}
      UPLOADS_DIR: /uploads
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-5173}:5173"
    # Browser → web; Vite proxies /api and /ws to http://api:8000 on the compose network
    # (container port stays 8000; only the host mapping API_PORT changes).
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
