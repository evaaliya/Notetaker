services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notetaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notetaker}
      POSTGRES_DB: ${POSTGRES_DB:-notetaker}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-notetaker}:${POSTGRES_PASSWORD:-notetaker}@postgres:5432/${POSTGRES_DB:-notetaker}
      E2E_HOOKS: ${E2E_HOOKS:-false}
      UPLOADS_DIR: /uploads
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  worker:
    build: ./api
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-notetaker}:${POSTGRES_PASSWORD:-notetaker}@postgres:5432/${POSTGRES_DB:-notetaker}
      UPLOADS_DIR: /uploads
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
